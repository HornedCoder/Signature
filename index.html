<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature</title>
    <style>
        .main{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .top, .bottom{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            margin: 10px 0 10px 0;
        }
        .block, button, input, option{
            width: 150px;
        }
        .canvas{
            border: 2px solid black;
        }
        

    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body>
    <div class="main">
        <div class = "top">
            <div class = "block">
                <p>Text Color Picker</p>
                <input class = "formControl" type = "color" id = "textColor">
                </input>
            </div>
            <div class = "block">
                <p>Background</p>
                <input class = "formControl" type = "color" id = "bgColor">
                </input>
            </div>
            <div class = "block">
                <p>Font Size</p>
                <select class = "customSize" type = "Value" id = "fontSize">
                    <option value = "5"> 5px </option>
                    <option value = "10"> 10px </option>
                    <option value = "15"> 15px </option>
                    <option value = "20"> 20px </option>
                    <option value = "25"> 25px </option>
                </select>
            </div>
        </div>
        <canvas class="canvas" id="myCanvas" width="500" height="300"></canvas>
        <div class = "bottom">
            <button type="button" class="btn btn-success" id = "save">Save</button>
            <button type="button" class="btn btn-danger" id = "clear">Clear</button>
            <button type="button" class="btn btn-warning" id = "retreive">Retreive</button>
        </div>
    </div>
    
    <script>
        const textColor = document.getElementById("textColor");
        const bgColor = document.getElementById("bgColor");
        const fontSize = document.getElementById("fontSize");
        const canvas = document.getElementById("myCanvas");
        const save = document.getElementById("save");
        const clear = document.getElementById("clear");
        const retrieve = document.getElementById("retreive");
        const ctx = canvas.getContext('2d');
        
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        textColor.addEventListener('change',(e)=>{
            ctx.strokeStyle = e.target.value;
            ctx.fillStyle = e.target.value;
        })

        canvas.addEventListener('mousedown',(e)=>{
            isDrawing = true;
            lastX = e.offsetX;
            lastY = e.offsetY;
        })

        canvas.addEventListener('mousemove',(e)=>{
            if (isDrawing){
                ctx.beginPath();
                ctx.moveTo(lastX,lastY);
                ctx.lineTo(event.offsetX, event.offsetY);
                ctx.stroke();

                lastX = e.offsetX;
                lastY = e.offsetY;
            }
        })

        canvas.addEventListener('mouseup',(e) => {
            isDrawing = false;
        })

        fontSize.addEventListener('change',(e)=>{
            ctx.lineWidth = e.target.value;
        })

        clear.addEventListener('click',()=>{
            ctx.clearRect(0,0,canvas.width,canvas.height)
        })

        save.addEventListener('click',()=>{
            localStorage.setItem('cc',canvas.toDataURL());
            let link = document.createElement('a');
            link.download = 'myCC.png';
            link.href = canvas.toDataURL();
            link.click();
        })

        retrieve.addEventListener('click',()=>{
            let savedCanvas = localStorage.getItem('cc');

            if(savedCanvas){
                let img = new Image();
                img.src = savedCanvas;
                ctx.drawImage(img,0,0);
            }
        })
    </script>
</body>
</html>
